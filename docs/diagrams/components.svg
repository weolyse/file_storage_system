<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
<title id="title">Draft component diagram</title>
<desc id="desc">Solid: MVP. Dashed purple: later processing and monitoring. Every component is planned.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="1400" height="920" fill="white"/>
<text x="30" y="34" font-size="24" fill="#182638" text-anchor="start" font-weight="bold">Draft component diagram</text>
<text x="30" y="62" font-size="15" fill="#526276" text-anchor="start" font-weight="normal">Solid: MVP. Dashed purple: later processing and monitoring. Every component is planned.</text>
<rect x="35" y="160" width="245" height="120" rx="12" fill="#f3f6fa" stroke="#235c91" stroke-width="2"/>
<text x="157.5" y="190" font-size="18" fill="#182638" text-anchor="middle" font-weight="bold">React frontend</text>
<text x="157.5" y="217" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Browser UI</text>
<text x="157.5" y="239" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">No infrastructure credentials</text>
<rect x="400" y="140" width="360" height="170" rx="12" fill="#f3f6fa" stroke="#235c91" stroke-width="2"/>
<text x="580.0" y="170" font-size="18" fill="#182638" text-anchor="middle" font-weight="bold">Spring Boot API</text>
<text x="580.0" y="197" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Auth, ownership, validation</text>
<text x="580.0" y="219" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">File and metadata coordination</text>
<text x="580.0" y="241" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Later: jobs + outbox publisher</text>
<rect x="990" y="100" width="365" height="155" rx="12" fill="#f3f6fa" stroke="#235c91" stroke-width="2"/>
<text x="1172.5" y="130" font-size="18" fill="#182638" text-anchor="middle" font-weight="bold">PostgreSQL</text>
<text x="1172.5" y="157" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">MVP: users and files</text>
<text x="1172.5" y="179" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Later: jobs, artifacts, outbox</text>
<text x="1172.5" y="201" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Authoritative metadata</text>
<rect x="990" y="350" width="365" height="145" rx="12" fill="#f3f6fa" stroke="#235c91" stroke-width="2"/>
<text x="1172.5" y="380" font-size="18" fill="#182638" text-anchor="middle" font-weight="bold">Single MinIO service</text>
<text x="1172.5" y="407" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Original bytes</text>
<text x="1172.5" y="429" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Generated artifacts later</text>
<text x="1172.5" y="451" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Private objects; S3 API</text>
<rect x="400" y="455" width="360" height="105" rx="12" fill="#f4f0fc" stroke="#6955a3" stroke-width="2" stroke-dasharray="8 5"/>
<text x="580.0" y="485" font-size="18" fill="#182638" text-anchor="middle" font-weight="bold">RabbitMQ · later</text>
<text x="580.0" y="512" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Task references; durable dispatch</text>
<rect x="400" y="670" width="360" height="140" rx="12" fill="#f4f0fc" stroke="#6955a3" stroke-width="2" stroke-dasharray="8 5"/>
<text x="580.0" y="700" font-size="18" fill="#182638" text-anchor="middle" font-weight="bold">Worker service × N · later</text>
<text x="580.0" y="727" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Claim → transform → commit</text>
<text x="580.0" y="749" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Independent processes</text>
<text x="580.0" y="771" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Manual ACK; idempotent effects</text>
<rect x="990" y="670" width="365" height="140" rx="12" fill="#f4f0fc" stroke="#6955a3" stroke-width="2" stroke-dasharray="8 5"/>
<text x="1172.5" y="700" font-size="18" fill="#182638" text-anchor="middle" font-weight="bold">Prometheus / Grafana · later</text>
<text x="1172.5" y="727" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Metrics and dashboards</text>
<text x="1172.5" y="749" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">Backlog, failures, service times</text>
<text x="1172.5" y="771" font-size="15" fill="#182638" text-anchor="middle" font-weight="normal">No business source of truth</text>
<polyline points="280,220 400,220" fill="none" stroke="#526276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="340" y="204" font-size="14" fill="#526276" text-anchor="middle" font-weight="normal">REST + JWT</text>
<polyline points="760,175 990,175" fill="none" stroke="#526276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="875" y="157" font-size="14" fill="#526276" text-anchor="middle" font-weight="normal">SQL / transactions</text>
<polyline points="760,270 840,270 840,410 990,410" fill="none" stroke="#526276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="900" y="392" font-size="14" fill="#526276" text-anchor="middle" font-weight="normal">S3 read / write</text>
<polyline points="580,310 580,455" fill="none" stroke="#6955a3" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="670" y="365" font-size="14" fill="#6955a3" text-anchor="middle" font-weight="normal">Outbox + confirms</text>
<polyline points="580,560 580,670" fill="none" stroke="#6955a3" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="665" y="613" font-size="14" fill="#6955a3" text-anchor="middle" font-weight="normal">Job IDs; ACK</text>
<polyline points="760,690 885,690 885,225 990,225" fill="none" stroke="#6955a3" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="870" y="612" font-size="14" fill="#6955a3" text-anchor="end" font-weight="normal">Claim / commit</text>
<polyline points="760,730 940,730 940,460 990,460" fill="none" stroke="#6955a3" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="925" y="557" font-size="14" fill="#6955a3" text-anchor="end" font-weight="normal">Objects</text>
<polyline points="990,780 760,780" fill="none" stroke="#6955a3" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="875" y="802" font-size="14" fill="#6955a3" text-anchor="middle" font-weight="normal">Scrape workers</text>
<polyline points="1160,670 1160,600 320,600 320,285 400,285" fill="none" stroke="#6955a3" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="1060" y="587" font-size="14" fill="#6955a3" text-anchor="middle" font-weight="normal">Scrape API</text>
<text x="35" y="866" font-size="17" fill="#182638" text-anchor="start" font-weight="normal">Deployment: Docker Compose for MVP. Kubernetes is later application orchestration, not a storage cluster.</text>
<text x="35" y="894" font-size="15" fill="#526276" text-anchor="start" font-weight="normal">Single database / broker / storage service can remain a single point of failure. Worker recovery is evaluated separately.</text>
</svg>
